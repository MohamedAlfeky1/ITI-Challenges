<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Player</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="mainContent">
      <div class="picture">
        <img
          id="currentImage"
          src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f"
        />
      </div>

      <audio
        id="audio"
        src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"
        controls
      ></audio>

      <div>
        Time: <input id="timeRange" type="range" min="0" value="timeRange" />
      </div>
      <div>
        Volume:
        <input
          id="volumeRange"
          type="range"
          min="0"
          max="1"
          value="1"
          step="1"
        />
      </div>

      <div>
        <button id="playBtn">Play</button>
        <button id="pauseBtn">Pause</button>
        <button id="stopBtn">Stop</button>
      </div>
    </div>
    <div id="trackList">
      <ul>
        <li
          onclick="selectTrack('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3', 'https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f')"
        >
          Chill Vibes
        </li>

        <li
          onclick="selectTrack('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3', 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4')"
        >
          Night Music
        </li>

        <li
          onclick="selectTrack('https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3', 'https://images.unsplash.com/photo-1497032628192-86f99bcd76bc')"
        >
          Piano Flow
        </li>
      </ul>
    </div>

    <script src="main.js"></script>
  </body>
</html>
