<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas Circles</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="handleChanges">
      <label for="canvasColor">Color: </label>
      <input type="color" name="color" id="canvasColor" />
      <label for="numberOfCircles">circles numbers: </label>
      <input
        type="number"
        name="numberOfCircles"
        id="numberOfCircles"
        min="1"
      />
      <button id="applyChangesBtn">Click me</button>
    </div>
    <canvas
      id="myCanvas"
      width="500"
      height="500"
      style="border: 1px solid #000000"
    >
    </canvas>
    <script src="main.js"></script>
  </body>
</html>
