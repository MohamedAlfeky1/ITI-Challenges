<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Car Animation</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-easing/1.4.1/jquery.easing.min.js"></script>

    <style>
      #car-img {
        position: absolute;
        top: 20px;
        left: 20px;
        width: 150px;
      }

      #left-value {
        margin-top: 100px;
        font-size: 20px;
        font-weight: bold;
        color: #333;
      }
    </style>
  </head>

  <body>
    <div class="img-animate">
      <img
        id="car-img"
        src="../assets/images/12.gif"
        alt="A moving car animation to the right"
      />
    </div>

    <div id="left-value">Left: 20px</div>

    <script>
      $(document).ready(function () {
        $("#car-img").animate(
          { left: "+=800px" },
          {
            duration: 5000,
            easing: "easeInOutExpo",
            step: function (leftVal) {
              $("#left-value").text("Left: " + Math.round(leftVal) + "px");
            },
          }
        );
      });
    </script>
  </body>
</html>
