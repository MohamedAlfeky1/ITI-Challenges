<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>jQuery UI Droppable - Assignment 4</title>
    <script src="https://code.jquery.com/jquery-3.7.1.js"></script>
    <script src="https://code.jquery.com/ui/1.14.1/jquery-ui.js"></script>
    <link
      rel="stylesheet"
      href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css"
    />
    <link rel="stylesheet" href="/resources/demos/style.css" />
    <style>
      #draggable {
        position: absolute;
        left: 10px;
        top: 10px;
        padding: 0.5em;
        margin: 10px 10px 10px 0;
        cursor: grab;
        z-index: 9999;
      }
      #draggable:focus {
        transform: scale(1.5);
      }
      #droppable {
        position: absolute;
        left: 200px;
        top: 10px;
        float: none;
        border: none;
        outline: none;
        background-color: transparent;
        margin: 10px;
      }

      .shake {
        animation: shakeAnim 0.3s infinite;
      }

      @keyframes shakeAnim {
        0% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-5px);
        }
        50% {
          transform: translateX(5px);
        }
        75% {
          transform: translateX(-5px);
        }
        100% {
          transform: translateX(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="draggable" class="ui-widget-content">
      <img src="../assets/images/2.jpg" alt="" />
    </div>

    <div id="droppable" class="ui-widget-header">
      <img src="../assets/images/3.JPG" alt="" />
    </div>

    <script>
      $(function () {
        $("#draggable").draggable({
          start: function () {
            $(this).css("border", "4px solid green").addClass("shake");
          },
          stop: function () {
            $(this).css("border", "none").removeClass("shake");
          },
        });

        $("#droppable").droppable({
          drop: function () {
            $("#draggable").hide(3000);
          },
        });
      });
      $("#draggable").click(function () {
        console.log("clicked");
      });
    </script>
  </body>
</html>
