<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>jQuery Zoom Demo</title>
    <script src="http://ajax.googleapis.com/ajax/libs/jquery/1.10.2/jquery.min.js"></script>
    <script src="zoom/jquery.zoom.min.js"></script>
    <style>
      * {
        border: 0;
        margin: 0;
        padding: 0;
      }
      p {
        position: absolute;
        top: 3px;
        right: 28px;
        color: #555;
        font: bold 13px/1 sans-serif;
      }
      img {
        width: 555px;
        height: 330px;
      }
      .zoom {
        display: inline-block;
        position: relative;
        cursor: zoom-in;
      }
      .zoom img {
        display: block;
      }
      .zoom img::selection {
        background-color: transparent;
      }
    </style>
  </head>
  <body>
    <span class="zoom" id="ex1">
      <img src="../assets/images/daisy.jpg" alt="Daisy on the Ohoopee" />
      <p>Hover</p>
    </span>
    <span class="zoom" id="ex2">
      <img src="../assets/images/daisy.jpg" alt="Roxy on the Ohoopee" />
      <p>Grab</p>
    </span>
    <span class="zoom" id="ex3">
      <img src="../assets/images/daisy.jpg" alt="Daisy on the Ohoopee" />
      <p>Click to activate</p>
    </span>
    <span class="zoom" id="ex4">
      <img src="../assets/images/daisy.jpg" alt="Roxy on the Ohoopee" />
      <p>Click to toggle</p>
    </span>
    <script>
      $(document).ready(function () {
        $("#ex1").zoom();
        $("#ex2").zoom({ on: "grab" });
        $("#ex3").zoom({ on: "click" });
        $("#ex4").zoom({ on: "toggle" });
      });
    </script>
  </body>
</html>
